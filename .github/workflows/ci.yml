name: Product Service CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: product_db
          POSTGRES_USER: product_user
          POSTGRES_PASSWORD: product_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U product_user -d product_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: local
      PRODUCT_DB_URL: jdbc:postgresql://localhost:5432/product_db
      PRODUCT_DB_USERNAME: product_user
      PRODUCT_DB_PASSWORD: product_local_password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp clean verify

      - name: Build Docker image
        run: docker build -t product-service:${{ github.sha }} .