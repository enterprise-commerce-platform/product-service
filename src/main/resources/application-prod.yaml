spring:
  datasource:
    url: ${PRODUCT_DB_URL}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}

    hikari:
      maximum-pool-size: ${PRODUCT_DB_POOL_SIZE:10}
      minimum-idle: ${PRODUCT_DB_MIN_IDLE:2}
      idle-timeout: ${PRODUCT_DB_IDLE_TIMEOUT:30000}
      connection-timeout: ${PRODUCT_DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${PRODUCT_DB_VALIDATION_TIMEOUT:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration